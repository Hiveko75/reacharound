# Builds the Minecraft 26.3 (Fabric) jar on every push to third-person-compat (or manually from the Actions tab).
name: Build 26.3 (Fabric)

on:
  push:
    branches: [third-person-compat]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: reacharound-26.3-fabric
          path: build/libs/*.jar
