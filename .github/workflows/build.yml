# Builds Reacharound (third-person-compat fork) for every supported Minecraft version.
# Each version lives on its own branch; this workflow checks them out one by one.
# Run when started by hand from the Actions tab.
name: Build all versions (Fabric)

# Started by hand only (Actions -> Run workflow): no builds on push or pull requests.
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release tag to add the jars to (empty = build only). An existing release gets only the jars it does not have yet.'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: '1.21.1'
            branch: tpcompat-1.21.1
            java: '21'
          - mc: '1.21.11'
            branch: tpcompat-1.21.11
            java: '21'
          - mc: '26.1.2'
            branch: tpcompat-26.1.2
            java: '25'
          - mc: '26.2'
            branch: tpcompat-26.2
            java: '25'
          - mc: '26.3'
            branch: third-person-compat
            java: '25'
    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace
          rm -f build/libs/*-sources.jar
          ls -l build/libs

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: reacharound-${{ matrix.mc }}-fabric
          path: build/libs/*.jar
          retention-days: 14

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: 'build/libs/*.jar'

  collect:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: reacharound-*-fabric
          merge-multiple: true
          path: dist
      - run: ls -l dist
      - name: Upload all jars
        uses: actions/upload-artifact@v4
        with:
          name: reacharound-all-versions
          path: dist/*.jar
          retention-days: 14

  release:
    needs: collect
    if: ${{ inputs.release != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: reacharound-all-versions
          path: dist
      - name: Add the jars to release ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" dist/*.jar --target "$GITHUB_SHA" --title "Reacharound $TAG (third-person-compat)" \
              --notes "Reacharound by spAnser with third-person camera support (the target follows the crosshair, e.g. with Leawind's Third Person) and the on/off message above the hotbar. One jar per Minecraft version (the version is in the file name)."
            exit 0
          fi
          have=$(gh release view "$TAG" --json assets -q '.assets[].name')
          for f in dist/*.jar; do
            n=$(basename "$f")
            if echo "$have" | grep -qxF "$n"; then echo "$n is already in $TAG"; else gh release upload "$TAG" "$f"; fi
          done
